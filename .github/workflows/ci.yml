name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v --timeout=60
      - name: Run grep gate (no amni.* in published source)
        shell: bash
        run: |
          if grep -rn "amni\." atex/ ; then
            echo "ERROR: closed-paradigm 'amni.*' references found in published source"
            exit 1
          fi
          echo "OK: no amni.* in atex/"
      - name: Run bench (smoke only)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m atex.cli bench --quiet
